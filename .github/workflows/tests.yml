name: Tests

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "Data/**"
      - "Doc/**"
      - "**/*.md"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "Data/**"
      - "Doc/**"
      - "**/*.md"

jobs:
  engine-and-server-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        with:
          version: "6.10.3"
          modules: "qtwebsockets"
          cache: true

      - name: Cache vcpkg repo
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg
          key: vcpkg-repo-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Clone vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}\vcpkg"

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: cmd
        run: "${{ github.workspace }}\\vcpkg\\bootstrap-vcpkg.bat"

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_EDITOR=OFF -DBUILD_CLIENT=OFF
          -DMMORPGENGINE_BUILD_TESTS=ON -DMMORPGSERVER_BUILD_TESTS=ON

      - name: Build Engine Tests
        run: cmake --build build --config Release --target MMORPGEngineTests

      - name: Build Server Tests
        run: cmake --build build --config Release --target MMORPGServerTests

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
