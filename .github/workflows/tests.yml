      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_SERVER=OFF -DBUILD_EDITOR=OFF
          -DMMORPGCLIENT_BUILD_TESTS=ON

      - name: Build Client Tests
        run: cmake --build build --config Release --target MMORPGClientTests

      - name: Run Client tests
        run: ctest --test-dir build/MMORPGClient/Test -C Release --output-on-failure

  editor-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
