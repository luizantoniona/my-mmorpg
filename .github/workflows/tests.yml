name: Tests

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "Data/**"
      - "Doc/**"
      - "**/*.md"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "Data/**"
      - "Doc/**"
      - "**/*.md"

jobs:
  engine-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_SERVER=OFF -DBUILD_CLIENT=OFF -DBUILD_EDITOR=OFF
          -DMMORPGENGINE_BUILD_TESTS=ON

      - name: Build Engine Tests
        run: cmake --build build --config Release --target MMORPGEngineTests

      - name: Run Engine tests
        run: ctest --test-dir build/MMORPGEngine/Test -C Release --output-on-failure

  server-tests:
