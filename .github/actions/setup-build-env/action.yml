name: Setup build environment
description: Instala Qt e prepara o vcpkg (com cache), compartilhado pelos jobs de teste de cada módulo.

inputs:
  qt-version:
    description: Versão do Qt a instalar
    required: false
    default: "6.10.3"
  qt-modules:
    description: Módulos extras do Qt (aqt)
    required: false
    default: "qtwebsockets"

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.0
      with:
        version: ${{ inputs.qt-version }}
        modules: ${{ inputs.qt-modules }}
        cache: true

    - name: Cache vcpkg repo
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\vcpkg
        key: vcpkg-repo-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

    - name: Clone vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: bash
      run: git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}\vcpkg"

    - name: Bootstrap vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: cmd
      run: "${{ github.workspace }}\\vcpkg\\bootstrap-vcpkg.bat"

    - name: Export GitHub Actions cache credentials
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

    - name: Enable vcpkg GitHub Actions binary cache
      shell: bash
      run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"
